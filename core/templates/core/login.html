<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>UMLM — Connexion</title>
    <style>
        body {
            font-family: -apple-system, Segoe UI, sans-serif;
            background: #f4f5f7;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: white;
            padding: 32px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            width: 320px;
        }
        h1 { font-size: 18px; margin-bottom: 20px; }
        label { display: block; font-size: 13px; margin-bottom: 4px; color: #555; }
        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .error { color: #dc2626; font-size: 13px; margin-bottom: 12px; }
    </style>
</head>
<body>
    <form class="login-box" method="post">
        <p style="margin-top:1rem; text-align:center;">
  Pas de compte ? <a href="{% url 'signup' %}">Créer un compte</a>
</p>
        {% csrf_token %}
        <h1>UMLM — Connexion</h1>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" required>
        <button type="submit">Se connecter</button>
        <label style="display:flex; align-items:center; gap:6px; margin-top:0.8rem;">
  <input type="checkbox" name="remember_me"> Rester connecté
</label>
    </form>
</body>
</html>
